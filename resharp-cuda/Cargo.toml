[package]
name = "resharp-cuda"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "CUDA-accelerated regex matching engine for resharp"
keywords = ["regex", "cuda", "gpu", "automata"]
categories = ["text-processing"]

[lib]
doctest = false

[dependencies]
resharp = { path = "../resharp-engine" }
resharp-algebra = { path = "../resharp-algebra" }

[build-dependencies]
cc = "1"

[[bench]]
name = "cpu_vs_gpu"
harness = false

